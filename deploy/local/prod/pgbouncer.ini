; Production-mode local stack: a transaction-mode pooler in front of Postgres,
; like Neon's pooled endpoint. Prepared statements are off, so the stack proves
; the app works without them. TLS on both sides.
[databases]
relaylab = host=postgres port=5432 dbname=relaylab

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 0
max_client_conn = 200
default_pool_size = 20
ignore_startup_parameters = extra_float_digits
client_tls_sslmode = require
client_tls_cert_file = /certs/server.crt
client_tls_key_file = /certs/server.key
server_tls_sslmode = verify-full
server_tls_ca_file = /certs/ca.crt
admin_users =
