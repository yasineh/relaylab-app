# RelayLab local development stack.
#   cp .env.example .env && docker compose up --build
# Open http://localhost:${WEB_HOST_PORT:-5173}. Values come from .env (dev-only
# placeholders). This is not a production configuration.

name: relaylab

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://app_runtime:${APP_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-relaylab}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-relaylab}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?}
      AUTH_MIGRATOR_PASSWORD: ${AUTH_MIGRATOR_PASSWORD:?}
      AUTH_RUNTIME_PASSWORD: ${AUTH_RUNTIME_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54320}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/initdb:/docker-entrypoint-initdb.d:ro
      - ./deploy/sql:/deploy-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies goose migrations with the migrator role, then exits.
  migrate:
    build: .
    image: relaylab:dev
    command: ["/usr/local/bin/api", "migrate"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MIGRATION_DATABASE_URL: postgres://app_migrator:${APP_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-relaylab}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: relaylab:dev
    command: ["/usr/local/bin/api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: relaylab:dev
    command: ["/usr/local/bin/worker"]
    environment:
      <<: *app-env
      WORKER_HEALTH_ADDR: ":8081"
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Vite dev server with hot reload; proxies /api, /h and health routes to api.
  web:
    image: node:24-alpine
    working_dir: /repo
    command:
      - sh
      - -c
      - npm install -g pnpm@12.16.1 >/dev/null && pnpm install --frozen-lockfile --filter @relaylab/web && pnpm --filter @relaylab/web dev
    environment:
      API_PROXY_TARGET: http://api:8080
      VITE_HOST: 0.0.0.0
      WEB_PORT: "5173"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ./package.json:/repo/package.json:ro
      - ./pnpm-lock.yaml:/repo/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/repo/pnpm-workspace.yaml:ro
      - ./backend/package.json:/repo/backend/package.json:ro
      - ./web:/repo/web
      - web_root_node_modules:/repo/node_modules
      - web_node_modules:/repo/web/node_modules
    depends_on:
      - api

  # Reserved for the Better Auth service (add-user-auth). It will run on the
  # internal network only and is never published to the host in
  # production-like profiles; the api proxies /api/auth/* to it.
  # auth:
  #   build: ./auth

  # Isolated cluster for Go integration tests (`make test-go`). Roles are
  # cluster-wide, so tests must never share a cluster with the dev database.
  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only-postgres
    ports:
      - "127.0.0.1:${POSTGRES_TEST_HOST_PORT:-54321}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  web_root_node_modules:
  web_node_modules:
