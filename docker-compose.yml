# RelayLab local development stack.
#   cp .env.example .env && docker compose up --build
# Open http://localhost:${WEB_HOST_PORT:-5173}. Values come from .env (dev-only
# placeholders). This is not a production configuration.

name: relaylab

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://app_runtime:${APP_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-relaylab}?sslmode=disable

# Shared by the api and the worker: replay settings and outbound policy.
x-replay-env: &replay-env
  REPLAY_ENABLED: ${REPLAY_ENABLED:-}
  REPLAY_OVERRIDE_ENC_KEY: ${REPLAY_OVERRIDE_ENC_KEY:?set REPLAY_OVERRIDE_ENC_KEY in .env}
  OUTBOUND_ALLOW_HTTP: ${OUTBOUND_ALLOW_HTTP:-false}
  OUTBOUND_ALLOWED_PORTS: ${OUTBOUND_ALLOWED_PORTS:-}
  OUTBOUND_BLOCKED_HOSTS: ${OUTBOUND_BLOCKED_HOSTS:-}
  INGEST_BASE_URL: ${INGEST_BASE_URL:-}

# Shared by the auth service and the api (session signing and the proxy header).
x-auth-env: &auth-env
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  AUTH_PROXY_SHARED_SECRET: ${AUTH_PROXY_SHARED_SECRET:?set AUTH_PROXY_SHARED_SECRET in .env}
  AUTH_SIGNUP_ENABLED: ${AUTH_SIGNUP_ENABLED:-true}
  AUTH_REQUIRE_EMAIL_VERIFICATION: ${AUTH_REQUIRE_EMAIL_VERIFICATION:-true}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-relaylab}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?}
      AUTH_MIGRATOR_PASSWORD: ${AUTH_MIGRATOR_PASSWORD:?}
      AUTH_RUNTIME_PASSWORD: ${AUTH_RUNTIME_PASSWORD:?}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54320}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/local/initdb:/docker-entrypoint-initdb.d:ro
      - ./deploy/sql:/deploy-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local SMTP server and inbox (verification and password-reset emails).
  # Inbox UI: http://localhost:${MAILPIT_UI_HOST_PORT:-8025}
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_HOST_PORT:-8025}:8025"

  # One-shot: re-applies deploy/sql/roles.sql (idempotent) so role and grant
  # changes reach an existing database volume, not only a freshly created one.
  db-roles:
    image: postgres:17-alpine
    command: ["sh", "/docker-entrypoint-initdb.d/00_roles.sh"]
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-relaylab}
      APP_MIGRATOR_PASSWORD: ${APP_MIGRATOR_PASSWORD:?}
      APP_RUNTIME_PASSWORD: ${APP_RUNTIME_PASSWORD:?}
      AUTH_MIGRATOR_PASSWORD: ${AUTH_MIGRATOR_PASSWORD:?}
      AUTH_RUNTIME_PASSWORD: ${AUTH_RUNTIME_PASSWORD:?}
    volumes:
      - ./deploy/local/initdb:/docker-entrypoint-initdb.d:ro
      - ./deploy/sql:/deploy-sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: applies the Better Auth schema (auth_migrator role) and the grants
  # the api needs. Runs before the goose migrations: app tables reference auth."user".
  auth-migrate:
    build:
      context: .
      dockerfile: auth/Dockerfile
    image: relaylab-auth:dev
    command: ["node", "src/cli/migrate.ts"]
    environment:
      AUTH_MIGRATION_DATABASE_URL: postgres://auth_migrator:${AUTH_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-relaylab}?sslmode=disable
    depends_on:
      db-roles:
        condition: service_completed_successfully

  # One-shot: applies goose migrations with the migrator role, then exits.
  migrate:
    build: .
    image: relaylab:dev
    command: ["/usr/local/bin/api", "migrate"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      MIGRATION_DATABASE_URL: postgres://app_migrator:${APP_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-relaylab}?sslmode=disable
    depends_on:
      auth-migrate:
        condition: service_completed_successfully

  # Better Auth service. Internal network only: never published to the host.
  # The api proxies /api/auth/* to it with the shared proxy header.
  auth:
    image: relaylab-auth:dev
    environment:
      <<: *auth-env
      APP_ENV: ${APP_ENV:-development}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_PORT: "3001"
      AUTH_DATABASE_URL: postgres://auth_runtime:${AUTH_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB:-relaylab}?sslmode=disable
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: ${MAIL_FROM:-RelayLab <no-reply@relaylab.localhost>}
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  api:
    image: relaylab:dev
    command: ["/usr/local/bin/api"]
    environment:
      <<: [*app-env, *auth-env, *replay-env]
      HTTP_ADDR: ":8080"
      AUTH_SERVICE_URL: http://auth:3001
      ENDPOINT_TOKEN_HMAC_KEY: ${ENDPOINT_TOKEN_HMAC_KEY:?set ENDPOINT_TOKEN_HMAC_KEY in .env}
      ENDPOINT_TOKEN_ENC_KEY: ${ENDPOINT_TOKEN_ENC_KEY:?set ENDPOINT_TOKEN_ENC_KEY in .env}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy

  worker:
    image: relaylab:dev
    command: ["/usr/local/bin/worker"]
    environment:
      <<: [*app-env, *replay-env]
      WORKER_HEALTH_ADDR: ":8081"
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-8081}:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Vite dev server with hot reload; proxies /api, /h and health routes to api.
  web:
    image: node:24-alpine
    working_dir: /repo
    command:
      - sh
      - -c
      - npm install -g pnpm@12.16.1 >/dev/null && pnpm install --frozen-lockfile --filter @relaylab/web && pnpm --filter @relaylab/web dev
    environment:
      API_PROXY_TARGET: http://api:8080
      VITE_HOST: 0.0.0.0
      WEB_PORT: "5173"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    volumes:
      - ./package.json:/repo/package.json:ro
      - ./pnpm-lock.yaml:/repo/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/repo/pnpm-workspace.yaml:ro
      - ./backend/package.json:/repo/backend/package.json:ro
      - ./auth/package.json:/repo/auth/package.json:ro
      - ./web:/repo/web
      - web_root_node_modules:/repo/node_modules
      - web_node_modules:/repo/web/node_modules
    depends_on:
      - api

  # Isolated cluster for Go and auth integration tests (`pnpm test`). Roles are
  # cluster-wide, so tests must never share a cluster with the dev database.
  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only-postgres
    ports:
      - "127.0.0.1:${POSTGRES_TEST_HOST_PORT:-54321}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  web_root_node_modules:
  web_node_modules:
